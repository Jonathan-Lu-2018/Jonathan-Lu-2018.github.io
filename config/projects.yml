PROJECTS:
  - title: "BrickBreaker"
    category: "Game Development"
    image: "src/images/brickbreaker.png"
    url: ""
    report_url: ""
    detail: |
      Description:
      A Java-based Brick Breaker game developed using object-oriented programming principles, featuring interactive paddle-and-ball gameplay, destructible bricks, multiple game levels, and a graphical desktop interface.
      Built with JavaFX, FXML, and CSS while applying modular class design to separate game entities, gameplay logic, and user-interface components.
      Provides an interactive arcade-style experience while demonstrating core object-oriented software design concepts.

      Key Technology & Contributions:
      - Developed an interactive Brick Breaker game in Java using JavaFX, implementing real-time paddle movement, ball physics, collision detection, brick destruction, and game-state management.
      - Applied object-oriented programming principles by designing reusable classes for core game components including the Ball, Paddle, Bricks, Player, Levels, and overall game logic.
      - Built and styled the graphical user interface using JavaFX, FXML, and CSS, incorporating multiple levels, player controls, and tutorial/gameplay functionality.

      Keywords:
      Java, JavaFX, FXML, CSS, Object-Oriented Programming, OOP, Game Development, Collision Detection, Event Handling, MVC, GUI Development

  - title: "Galaxy Shoes"
    category: "Full-Stack Development"
    image: "src/images/galaxyshoes.png"
    url: ""
    report_url: ""
    detail: |
      Description:
      A full-stack e-commerce web application for browsing and purchasing footwear from popular brands, built using a three-tier architecture with separate presentation, application, and data layers.
      The application leverages React for the frontend, Java Spring Boot for backend services, MySQL for persistent data storage, and AWS EC2 for cloud deployment.
      Provides users with account registration, authentication, and an interactive shoe catalog while demonstrating scalable full-stack application architecture. 

      Key Technology & Contributions:
      - Developed a full-stack e-commerce application using React and Java Spring Boot, implementing user registration, authentication, product catalog browsing, and dynamic frontend-backend communication.
      - Designed a three-tier application architecture separating the React presentation layer, Spring Boot application logic, and MySQL data layer for maintainable and scalable application development.
      - Integrated MySQL for persistent user and product data storage and deployed the application to AWS EC2, gaining hands-on experience with cloud-hosted full-stack application deployment.

      Keywords:
      Java, Spring Boot, React, JavaScript, MySQL, AWS, EC2, REST API, Full-Stack Development, Three-Tier Architecture, Authentication, Database Design, Cloud Deployment, E-Commerce

  - title: "Slice"
    category: "Full-Stack Development"
    image: "src/images/slice.png"
    url: ""
    report_url: ""
    detail: |
      Description:
      A full-stack food delivery web application that enables customers to browse restaurants, explore menu items, and place food orders through an interactive online interface.
      Built using Python and Django for backend application logic, SQLite for persistent data storage, and JavaScript, HTML/CSS, and Bootstrap for the frontend.
      Provides an end-to-end food ordering experience while demonstrating full-stack web development, database integration, and server-side application design.

      Key Technology & Contributions:
      - Developed a full-stack food delivery application using Python and Django, implementing server-side application logic and database-backed functionality for managing restaurant, menu, and ordering data.
      - Built responsive user interfaces using HTML, CSS, JavaScript, and Bootstrap, providing customers with an intuitive experience for browsing food options and interacting with the application.
      - Integrated Django with SQLite for persistent application data and utilized Django's administrative functionality to support backend data management and application administration.

      Keywords:
      Python, Django, JavaScript, HTML, CSS, Bootstrap, SQLite, Full-Stack Development, Web Development, Database Integration, Backend Development, MVC, Django ORM

  - title: "iSky"
    category: "Web Development"
    image: "src/images/isky.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      A full-stack vacation planning web application designed to help travelers make informed trip decisions by combining destination, weather, mapping, travel, and COVID-19 information within a centralized platform.
      Built using React.js, Node.js, JavaScript, HTML, and CSS with integrations across multiple third-party APIs including OpenWeatherMap, Google Maps, Travel Advisor, and COVID-19 data services.
      Provides travelers with an interactive platform for researching destinations and planning trips using real-time external data.

      Key Technology & Contributions:
      - Developed an interactive vacation planning web application using React.js and JavaScript, creating reusable frontend components and responsive interfaces for exploring travel destinations and trip information.
      - Integrated multiple third-party REST APIs including OpenWeatherMap, Google Maps, Travel Advisor, and COVID-19 data services to aggregate weather, geographic, travel, and pandemic-related information.
      - Collaborated within a four-person senior project team to design, develop, test, and deploy the application using Git-based version control and Netlify, delivering a centralized travel-planning experience.

      Keywords:
      JavaScript, React.js, Node.js, HTML, CSS, REST API, OpenWeatherMap, Google Maps, Travel Advisor API, API Integration, Frontend Development, Web Development, Git, Netlify, Agile Development

  - title: "LeetCoach"
    category: "AI & Machine Learning"
    image: "src/images/leetcoach.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      An AI-powered Chrome extension that provides contextual coding assistance directly within LeetCode, helping users debug solutions, understand algorithms, and improve code without leaving the problem page.
      The extension automatically detects LeetCode problems and extracts in-editor code, integrating multiple LLM providers to generate targeted hints, debugging guidance, complexity analysis, and code improvements.
      Provides an interactive developer tool designed to streamline technical interview preparation while encouraging logic-first problem solving.

      Key Technology & Contributions:
      - Developed a Chrome extension using JavaScript and Chrome Manifest V3 that automatically detects LeetCode problems, extracts editor code and programming language context, and provides an integrated side-panel assistant.
      - Integrated OpenAI, Google Gemini, and Anthropic Claude APIs with dynamic model selection, enabling users to receive contextual debugging assistance, algorithm explanations, targeted hints, and time/space complexity analysis.
      - Implemented Chrome content scripts, background service workers, runtime messaging, and LeetCode SPA navigation detection to synchronize problem context and AI-assisted recommendations without requiring users to manually copy code between applications.

      Keywords:
      JavaScript, Chrome Extension, Manifest V3, OpenAI API, Google Gemini API, Anthropic Claude API, Large Language Models, Generative AI, REST API, Prompt Engineering, Developer Tools, Algorithms, LeetCode, Browser Extensions

  - title: "SmartStay"
    category: "AI & Machine Learning"
    image: "src/images/smartstay.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      A machine learning-powered Airbnb recommendation system that provides personalized California lodging recommendations based on user preferences including location, budget, property type, amenities, guest count, and ratings.
      The application combines content-based filtering, collaborative filtering, popularity scoring, and recency signals into a hybrid recommendation engine while providing AI-generated explanations for recommended listings.
      Provides an interactive Streamlit interface for exploring listings, comparing recommendation models, and analyzing recommendation quality.

      Key Technology & Contributions:
      - Developed a hybrid recommendation system combining content-based filtering, collaborative filtering, popularity scoring, and time-based recency signals to generate personalized Airbnb recommendations.
      - Implemented machine learning techniques using scikit-learn, including TF-IDF, cosine similarity, and k-nearest neighbors, with model evaluation across Precision@K, Coverage, Diversity, and Novelty metrics.
      - Built an interactive Streamlit application with configurable user preferences, Plotly data visualizations, side-by-side recommendation model comparisons, and Google Gemini integration for AI-generated explanations of recommended listings.

      Keywords:
      Python, Machine Learning, Recommendation Systems, Scikit-learn, Collaborative Filtering, Content-Based Filtering, K-Nearest Neighbors, TF-IDF, Cosine Similarity, Google Gemini, Streamlit, Plotly, Data Visualization, Model Evaluation

  - title: "Hand Gesture Recognizer"
    category: "AI & Machine Learning"
    image: "src/images/handgesture.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      A real-time computer vision application that recognizes hand gestures from live webcam input using MediaPipe-based hand tracking and gesture recognition.
      The application processes video frames using OpenCV, detects hand landmarks and gestures, and displays predictions with confidence scores through an interactive desktop interface.
      Includes performance evaluation, latency testing, robustness analysis, and ablation experiments to assess recognition accuracy and system behavior under varying conditions.

      Key Technology & Contributions:
      - Developed a real-time hand gesture recognition pipeline using Python, MediaPipe, and OpenCV to process webcam input, detect hand landmarks, classify gestures, and display prediction confidence.
      - Built an interactive Tkinter interface with multithreaded video processing, real-time gesture visualization, start/stop controls, and automated gesture-based image capture for dataset collection.
      - Evaluated recognition performance through accuracy analysis, latency testing, robustness experiments, and normalization/image-space ablation studies to assess model behavior across different input conditions.

      Keywords:
      Python, MediaPipe, OpenCV, Computer Vision, Machine Learning, Hand Gesture Recognition, Image Processing, Real-Time Inference, Tkinter, PIL, Multithreading, Model Evaluation, Ablation Study

  - title: "AI Rock-Paper-Scissor"
    category: "Game Development"
    image: "src/images/rockpaper.png"
    url: ""
    report_url: ""
    detail: |
      Description: 
      A real-time computer vision Rock-Paper-Scissors game that enables players to compete against a computer using hand gestures captured through a webcam.
      The application leverages MediaPipe-based hand tracking, CVZone, and OpenCV to detect hand landmarks, recognize Rock, Paper, and Scissors gestures, and determine game outcomes in real time.
      Provides an interactive vision-based gaming experience with live gesture recognition, score tracking, timed rounds, and automated gameplay.

      Key Technology & Contributions:
      - Developed a real-time computer vision pipeline using Python, OpenCV, CVZone, and MediaPipe to capture webcam input, detect hand landmarks, and recognize Rock, Paper, and Scissors gestures.
      - Implemented gesture classification based on detected finger positions, translating hand-tracking data into player moves and integrating the results with automated game logic.
      - Built an interactive game loop featuring timed rounds, randomized computer moves, real-time score tracking, graphical overlays, and automated screenshot collection of player gestures.

      Keywords:
      Python, OpenCV, MediaPipe, CVZone, Computer Vision, Hand Tracking, Hand Gesture Recognition, Image Processing, Real-Time Video Processing, Game Development
