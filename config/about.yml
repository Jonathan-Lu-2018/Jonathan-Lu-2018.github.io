HEADER:
  label: "About me"

PRESENTATION:
  description: |
    I'm a Software Engineer based in the San Francisco Bay Area, passionate about Backend Development, Cloud Engineering, and Artificial Intelligence, with experience in cloud infrastructure, software development, automation, and AI-powered applications.
    I graduated from San José State University with a B.S. in Software Engineering and am currently pursuing an M.S. in Artificial Intelligence.
    Currently, I work as a Software Engineer at PwC, where I build and support solutions across Azure and AWS, full-stack applications, infrastructure automation, and Generative AI. My interests lie in backend engineering, AI-powered applications, and building scalable software systems.
    Outside of work, I enjoy running, playing badminton and basketball, and supporting Bay Area sports teams.
    Feel free to connect and get in touch with me! :)

